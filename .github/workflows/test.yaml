name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  agent_board:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: .ci/test/agent_board.sh
  install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: sh -ec "if [ -r ~/.profile ]; then . ~/.profile; fi && . {0}"
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          sudo apt -y remove firefox google-* llvm* microsoft-* php*
          sudo apt -y autoremove
          sudo apt -y clean
          sudo rm -rf /usr/local/lib/android
        if: runner.os == 'Linux'
      - run: brew upgrade -y --overwrite
        if: runner.os == 'macOS'
      - run: cp profile ~/.profile
      - run: cp -r . ~/.dotfiles
      - run: ~/.dotfiles/local/bin/update-homebrew
      - run: rcup -f
      - run: update
  test:
    needs:
      - agent_board
      - install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            [ $result = success ]
          done
